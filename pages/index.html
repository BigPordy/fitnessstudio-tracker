<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitnessstudio Tracker - Vercel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #333; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 32px;
        }
        
        .login-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label { 
            display: block; 
            margin-bottom: 6px; 
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input { 
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button { 
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        button:hover { background: #5568d3; }
        button:disabled { background: #999; cursor: not-allowed; }
        
        .status {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }
        
        .status.success { 
            background: #d4edda; 
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error { 
            background: #f8d7da; 
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .dashboard {
            display: none;
        }
        
        .stats { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label { 
            font-size: 12px; 
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value { 
            font-size: 36px; 
            font-weight: bold; 
            margin: 12px 0; 
        }
        
        .stat-unit { 
            font-size: 12px; 
            opacity: 0.9;
        }
        
        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .controls button {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            font-size: 14px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #ddd;
            font-weight: 600;
            color: #555;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        .data-table tr:hover { background: #f8f9fa; }
        
        .loading { 
            display: inline-block; 
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-url {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 24px; }
            .stats { grid-template-columns: 1fr; }
            .controls button { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ Fitnessstudio Tracker</h1>
        
        <!-- Login -->
        <div id="loginSection" class="login-section">
            <h3>Anmelden</h3>
            <div class="form-group">
                <label>Elements Username:</label>
                <input type="text" id="username" placeholder="dein@email.com">
            </div>
            <div class="form-group">
                <label>Passwort:</label>
                <input type="password" id="password" placeholder="Dein Passwort">
            </div>
            <div class="form-group">
                <label>Studio ID (optional):</label>
                <input type="text" id="studioId" placeholder="z.B. 123">
            </div>
            <button onclick="startTracking()">Tracking starten</button>
            <div class="api-url" id="apiUrl"></div>
        </div>
        
        <!-- Status -->
        <div id="status" class="status"></div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="controls">
                <button onclick="refreshData()">🔄 Jetzt aktualisieren</button>
                <button onclick="exportData()">📥 CSV Export</button>
                <button onclick="clearData()">🗑️ Daten löschen</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Aktuell</div>
                    <div class="stat-value" id="currentOccupancy">-</div>
                    <div class="stat-unit">Auslastung %</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Durchschnitt (heute)</div>
                    <div class="stat-value" id="avgToday">-</div>
                    <div class="stat-unit">Auslastung %</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Peak (heute)</div>
                    <div class="stat-value" id="peakToday">-</div>
                    <div class="stat-unit">Auslastung %</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Messungen</div>
                    <div class="stat-value" id="dataPoints">0</div>
                    <div class="stat-unit">insgesamt</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="occupancyChart"></canvas>
            </div>
            
            <h3>Letzte Messungen</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Zeitstempel</th>
                        <th>Auslastung</th>
                        <th>Personen</th>
                        <th>Kapazität</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // API URL
        const API_URL = window.location.origin + '/api';
        document.getElementById('apiUrl').innerHTML = `API: ${API_URL}`;

        // ============ KONFIGURATION ============
        const CONFIG = {
            storageKey: 'fitnessTrackerData',
            tokenKey: 'fitnessTrackerToken',
            studioIdKey: 'studioId'
        };

        // ============ HAUPTFUNKTIONEN ============
        
        async function startTracking() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const studioId = document.getElementById('studioId').value;

            if (!username || !password) {
                showStatus('❌ Benutzername und Passwort erforderlich', 'error');
                return;
            }

            try {
                showStatus('⏳ Verbindung wird hergestellt...', 'success');
                
                // Login API aufrufen
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    throw new Error('Login fehlgeschlagen');
                }

                const data = await response.json();
                const token = data.token;

                // Token speichern
                localStorage.setItem(CONFIG.tokenKey, token);
                localStorage.setItem(CONFIG.studioIdKey, studioId || '0');
                localStorage.setItem(CONFIG.storageKey, JSON.stringify([]));
                
                // Erste Daten abrufen
                await refreshData();
                
                // UI aktualisieren
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                showStatus('✅ Tracking aktiv! Aktualisiert sich automatisch.', 'success');
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        async function refreshData() {
            try {
                const token = localStorage.getItem(CONFIG.tokenKey);
                if (!token) throw new Error('Token nicht gefunden');

                // Daten von API abrufen
                const response = await fetch(`${API_URL}/occupancy?hours=24`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Fehler beim Abrufen');

                const result = await response.json();
                const data = result.data;

                // Lokal speichern
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));

                updateDashboard(data);
                showStatus('✅ Daten aktualisiert', 'success');
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        function updateDashboard(data = null) {
            if (!data) {
                data = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '[]');
            }
            
            if (data.length === 0) return;

            const today = data.filter(d => isToday(new Date(d.timestamp)));
            const latest = data[data.length - 1];
            
            // Stats
            document.getElementById('currentOccupancy').textContent = latest.percentage.toFixed(1);
            document.getElementById('avgToday').textContent = today.length > 0 
                ? (today.reduce((a, d) => a + d.percentage, 0) / today.length).toFixed(1)
                : '-';
            document.getElementById('peakToday').textContent = today.length > 0
                ? Math.max(...today.map(d => d.percentage)).toFixed(1)
                : '-';
            document.getElementById('dataPoints').textContent = data.length;

            // Tabelle
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = data.slice(-10).reverse().map(d => `
                <tr>
                    <td>${new Date(d.timestamp).toLocaleString('de-DE')}</td>
                    <td>${d.percentage.toFixed(1)}%</td>
                    <td>${d.current_occupancy}</td>
                    <td>${d.max_capacity}</td>
                </tr>
            `).join('');

            // Chart
            updateChart(today);
        }

        function updateChart(data) {
            const ctx = document.getElementById('occupancyChart').getContext('2d');
            
            if (window.occupancyChartInstance) {
                window.occupancyChartInstance.destroy();
            }

            window.occupancyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => new Date(d.timestamp).toLocaleTimeString('de-DE', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    })),
                    datasets: [{
                        label: 'Auslastung %',
                        data: data.map(d => d.percentage),
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }

        function exportData() {
            const data = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '[]');
            let csv = 'Zeitstempel,Auslastung (%),Personen,Kapazität\n';
            data.forEach(d => {
                csv += `"${new Date(d.timestamp).toLocaleString('de-DE')}",${d.percentage.toFixed(1)},${d.current_occupancy},${d.max_capacity}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `tracker-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function clearData() {
            if (confirm('Alle Daten wirklich löschen?')) {
                localStorage.removeItem(CONFIG.storageKey);
                updateDashboard([]);
                showStatus('✅ Daten gelöscht', 'success');
            }
        }

        function logout() {
            localStorage.removeItem(CONFIG.tokenKey);
            localStorage.removeItem(CONFIG.storageKey);
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showStatus('', '');
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = message ? 'block' : 'none';
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem(CONFIG.tokenKey)) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                updateDashboard();
            }
        });
    </script>
</body>
</html>
